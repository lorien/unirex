[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "exp_rurex"
version = "0.1.0"
description = "Experimental linear-time regex engine over CPython UCS storage"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
features = ["extension-module"]
module-name = "exp_rurex"
