name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test release
        run: cargo test --release
      - name: Check the Python feature
        run: cargo check --features python
      - name: Package the crates.io placeholder
        run: cargo publish --dry-run --manifest-path packaging/crates-stub/Cargo.toml

  binding:
    name: Binding (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: binding-${{ matrix.python-version }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: binding-${{ matrix.python-version }}-
      - name: Install maturin
        run: python -m pip install --disable-pip-version-check maturin
      - name: Build the extension
        run: maturin build --release --out var/wheels
      - name: Install the extension
        run: python -m pip install --disable-pip-version-check var/wheels/*.whl
      - name: Cache the benchmark corpus
        uses: actions/cache@v4
        with:
          path: var/bench-data
          key: corpus-telegram-v1
      - name: Install the conformance dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Smoke test the binding
        run: python tools/test_python_binding.py
      # Each supported CPython release has its own vendored suite and ledger.
      # Legs without a ledger yet generate one and report it without failing, so
      # the gap is visible instead of hidden behind a version condition.
      - name: CPython conformance suite
        run: |
          version=$(python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          if [ -f "tests/cpython/$version/EXPECTED.py" ]; then
            python -m pytest "tests/cpython/$version/vendored_test_re.py" -q --tb=short
          else
            echo "::warning::no conformance ledger for CPython $version yet"
            python tools/gen_conformance_ledger.py
            cat "tests/cpython/$version/EXPECTED.py"
          fi
          python -m pytest tests/test_re_guard.py -q
      - name: End-to-end benchmark, 100k posts
        run: python tools/bench_python.py --engine unirex --limit 100000 --repeat 2

  python-diff:
    name: Python differential
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: diff-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: diff-${{ runner.os }}-
      - name: Compare against CPython re
        run: python3 tools/python_diff.py --patterns 300 --max-length 3

  bench:
    name: Benchmark self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: bench-${{ runner.os }}-
      - name: Self-test
        run: cargo run --release --example bench -- --self-test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check links, markers, and stale names
        run: python3 tools/check_docs.py
      - name: Check the generated class tables are current
        run: python3 tools/gen_unicode_tables.py --check
