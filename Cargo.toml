[package]
name = "exp_rurex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental linear-time regex engine over CPython UCS storage"

[dependencies]
regex-syntax = "0.8"
memchr = "2.8"
bytemuck = "1"

[dev-dependencies]
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ureq = "3"
sha2 = "0.10"
